[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-json2"
version = "0.1.0"
description = "A small, dependency-free client for Odoo's External JSON-2 API (Odoo 19 and later)."
license = "MIT"
authors = [{ name = "TicketWave HQ Ltd" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["odoo", "json-2", "erp", "api-client"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/TicketWaveHQ/odoo-json2"
Issues = "https://github.com/TicketWaveHQ/odoo-json2/issues"
Changelog = "https://github.com/TicketWaveHQ/odoo-json2/blob/main/CHANGELOG.md"

[project.scripts]
odoo-json2-preflight = "odoo_json2.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
odoo_json2 = ["py.typed"]
